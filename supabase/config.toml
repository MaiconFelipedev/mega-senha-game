project_id = "senha-rapida-online"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 55323

[inbucket]
enabled = true
port = 55324
smtp_port = 55325
pop3_port = 55326

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173", "http://127.0.0.1:4173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_anonymous_sign_ins = true
minimum_password_length = 8

[auth.captcha]
enabled = false
provider = "turnstile"
secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

[analytics]
enabled = false
